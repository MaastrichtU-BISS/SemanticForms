{% extends "layout.html" %}
{% block content %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Instance Details</h1>
        <div>
            <a href="/instance/{{ identifier }}/edit" class="btn btn-primary">
                <i class="fas fa-edit"></i> Edit
            </a>
            {% if user %}
            <button type="button" class="btn btn-danger" data-toggle="modal" data-target="#deleteModal">
                <i class="fas fa-trash"></i> Delete
            </button>
            {% endif %}
        </div>
    </div>

    {% if user %}
    <div class="modal fade" id="deleteModal" tabindex="-1" role="dialog" aria-labelledby="deleteModal" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Deletion</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this instance? This action cannot be undone.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <a href="/instance/{{ identifier }}/delete">
                        <button type="button" class="btn btn-danger">Yes, Delete</button>
                    </a>
                </div>
            </div>
        </div>
    </div>
    {% endif %}

    <div id="instance-view"></div>
</div>

{% include "_instance_viewer.html" %}
<script>
    new InstanceViewer({{ templateObject | tojson | safe }}, {{ jsonData | tojson | safe }}, 'instance-view').render();
</script>
{% endblock %}
