{% extends "layout.html" %}
{% block content %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Instance Details</h1>
        <div>
            <a href="/instance/{{ identifier }}/edit" class="btn btn-primary">
                <i class="fas fa-edit"></i> Edit
            </a>
            {% if user %}
            <button type="button" class="btn btn-danger" data-toggle="modal" data-target="#deleteModal">
                <i class="fas fa-trash"></i> Delete
            </button>
            {% endif %}
        </div>
    </div>

    {% if user %}
    <div class="modal fade" id="deleteModal" tabindex="-1" role="dialog" aria-labelledby="deleteModal" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Deletion</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    Are you sure you want to delete this instance? This action cannot be undone.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <a href="/instance/{{ identifier }}/delete">
                        <button type="button" class="btn btn-danger">Yes, Delete</button>
                    </a>
                </div>
            </div>
        </div>
    </div>
    {% endif %}

    <div id="instance-view"></div>
</div>

<style>
    /* Concise documentation-style view */
    #instance-view {
        max-width: 900px;
        margin: 0 auto;
        font-size: 0.95rem;
    }
    
    .cedar-section {
        margin-bottom: 2rem;
    }
    
    .cedar-section-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 0.25rem;
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 1rem;
    }
    
    .cedar-section-content {
        padding: 0;
    }
    
    .cedar-nested-element {
        margin-bottom: 1.25rem;
        padding-left: 1rem;
        border-left: 3px solid #e0e0e0;
    }
    
    .cedar-nested-element-title {
        color: #495057;
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
    }
    
    .cedar-field {
        margin-bottom: 0.75rem;
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 1rem;
        align-items: baseline;
    }
    
    .cedar-field-label {
        font-weight: 500;
        color: #6c757d;
        font-size: 0.9rem;
        text-align: right;
        padding-right: 0.5rem;
    }
    
    .cedar-field-description {
        display: none; /* Hide descriptions for conciseness */
    }
    
    .cedar-field-value {
        color: #212529;
        font-size: 0.95rem;
        line-height: 1.5;
    }
    
    .cedar-field-value.empty {
        color: #adb5bd;
        font-style: italic;
    }
    
    .cedar-field-value a {
        color: #2c5aa0;
        text-decoration: none;
        word-break: break-word;
    }
    
    .cedar-field-value a:hover {
        text-decoration: underline;
    }
    
    .cedar-array-items {
        display: block;
    }
    
    .cedar-array-item {
        margin-bottom: 1rem;
        padding: 0.75rem;
        background: #f8f9fa;
        border-left: 3px solid #dee2e6;
    }
    
    .cedar-array-item:last-child {
        margin-bottom: 0;
    }
    
    .cedar-array-item-header {
        color: #6c757d;
        font-weight: 500;
        font-size: 0.85rem;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    .cedar-array-item .cedar-field {
        margin-bottom: 0.5rem;
        grid-template-columns: 150px 1fr;
        gap: 0.75rem;
    }
    
    .cedar-array-item .cedar-field:last-child {
        margin-bottom: 0;
    }
    
    .cedar-array-item .cedar-field-label {
        font-size: 0.85rem;
    }
    
    .cedar-array-item .cedar-field-value {
        font-size: 0.9rem;
    }
    
    .cedar-ontology-badge {
        display: inline-block;
        background: #e7f3ff;
        color: #2c5aa0;
        padding: 0.125rem 0.375rem;
        border-radius: 0.25rem;
        font-size: 0.75rem;
        margin-right: 0.375rem;
        font-weight: 500;
    }
    
    /* Responsive: stack on smaller screens */
    @media (max-width: 768px) {
        .cedar-field {
            grid-template-columns: 1fr;
            gap: 0.25rem;
        }
        
        .cedar-field-label {
            text-align: left;
            padding-right: 0;
            font-weight: 600;
        }
        
        .cedar-array-item .cedar-field {
            grid-template-columns: 1fr;
        }
    }
</style>

<script>
    const templateObject = {{ templateObject | tojson | safe }};
    const instanceData = {{ jsonData | tojson | safe }};

    class InstanceViewer {
        constructor(template, instance, containerId) {
            this.template = template;
            this.instance = instance;
            this.container = document.getElementById(containerId);
        }

        // Helper function to detect URLs and convert them to links
        makeLinksClickable(text) {
            if (!text || typeof text !== 'string') {
                return text;
            }
            
            // URL regex pattern - matches http(s):// and www. URLs
            const urlPattern = /(\b(https?:\/\/|www\.)[^\s<]+[^<.,:;"')\]\s])/gi;
            
            // Check if text contains a URL
            if (urlPattern.test(text)) {
                const fragment = document.createDocumentFragment();
                let lastIndex = 0;
                
                // Reset regex
                urlPattern.lastIndex = 0;
                let match;
                
                while ((match = urlPattern.exec(text)) !== null) {
                    // Add text before the URL
                    if (match.index > lastIndex) {
                        fragment.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));
                    }
                    
                    // Add the URL as a link
                    const link = document.createElement('a');
                    let url = match[0];
                    // Add http:// if URL starts with www.
                    link.href = url.startsWith('www.') ? 'http://' + url : url;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.textContent = url;
                    fragment.appendChild(link);
                    
                    lastIndex = match.index + match[0].length;
                }
                
                // Add remaining text
                if (lastIndex < text.length) {
                    fragment.appendChild(document.createTextNode(text.substring(lastIndex)));
                }
                
                return fragment;
            }
            
            // No URLs found, return plain text
            return text;
        }

        render() {
            const properties = this.template.properties || {};
            const order = this.template._ui?.order || Object.keys(properties);

            let currentSection = null;
            let currentSectionContent = null;

            for (const fieldName of order) {
                const fieldSchema = properties[fieldName];
                if (!fieldSchema || fieldName.startsWith('@')) continue;

                const fieldValue = this.instance[fieldName];
                const fieldType = fieldSchema['@type'];
                const isStaticField = fieldType === 'https://schema.metadatacenter.org/core/StaticTemplateField';
                
                // Handle section breaks - create new section
                if (isStaticField && fieldSchema._ui?.inputType === 'section-break') {
                    const label = this.template._ui?.propertyLabels?.[fieldName] || fieldSchema['schema:name'] || fieldName;
                    
                    const section = document.createElement('div');
                    section.className = 'cedar-section';
                    
                    const header = document.createElement('div');
                    header.className = 'cedar-section-header';
                    header.textContent = label;
                    section.appendChild(header);
                    
                    const content = document.createElement('div');
                    content.className = 'cedar-section-content';
                    section.appendChild(content);
                    
                    this.container.appendChild(section);
                    currentSection = section;
                    currentSectionContent = content;
                    continue;
                }
                
                // Render the field
                const fieldElement = this.renderField(fieldName, fieldSchema, fieldValue);
                
                if (fieldElement) {
                    // Add to current section if exists, otherwise add to container
                    if (currentSectionContent) {
                        currentSectionContent.appendChild(fieldElement);
                    } else {
                        // Create default section if no section exists yet
                        if (!currentSection) {
                            const section = document.createElement('div');
                            section.className = 'cedar-section';
                            
                            const content = document.createElement('div');
                            content.className = 'cedar-section-content';
                            section.appendChild(content);
                            
                            this.container.appendChild(section);
                            currentSection = section;
                            currentSectionContent = content;
                        }
                        currentSectionContent.appendChild(fieldElement);
                    }
                }
            }
        }

        renderField(fieldName, fieldSchema, value) {
            const label = this.template._ui?.propertyLabels?.[fieldName] || fieldSchema['schema:name'] || fieldName;
            const description = this.template._ui?.propertyDescriptions?.[fieldName] || fieldSchema['schema:description'];
            
            const fieldType = fieldSchema['@type'];
            const isStaticField = fieldType === 'https://schema.metadatacenter.org/core/StaticTemplateField';
            const isCedarElement = fieldType === 'https://schema.metadatacenter.org/core/TemplateElement';
            const isCedarField = fieldType === 'https://schema.metadatacenter.org/core/TemplateField';
            const isArray = fieldSchema.type === 'array';

            // Handle static fields (section breaks) - already handled in render()
            if (isStaticField) {
                return null;
            }

            // Handle array fields
            if (isArray) {
                return this.renderArrayField(fieldName, fieldSchema, value, label, description);
            }

            // Handle Cedar Elements (nested objects)
            if (isCedarElement) {
                return this.renderNestedElement(fieldName, fieldSchema, value, label, description);
            }

            // Handle Cedar Fields
            if (isCedarField) {
                return this.renderSimpleField(fieldName, fieldSchema, value, label, description);
            }

            return null;
        }

        renderSimpleField(fieldName, fieldSchema, value, label, description) {
            // Skip if value is empty
            if (!value || (typeof value === 'object' && (!value['@value'] || value['@value'] === null) && !value['@id'])) {
                return null;
            }

            const fieldDiv = document.createElement('div');
            fieldDiv.className = 'cedar-field';

            const labelElement = document.createElement('div');
            labelElement.className = 'cedar-field-label';
            labelElement.textContent = label;
            fieldDiv.appendChild(labelElement);

            // Show description if available and meaningful
            if (description && description !== 'Help Text' && description.trim()) {
                const descElement = document.createElement('div');
                descElement.className = 'cedar-field-description';
                descElement.textContent = description;
                fieldDiv.appendChild(descElement);
            }

            const valueElement = document.createElement('div');
            valueElement.className = 'cedar-field-value';

            // Handle ontology fields (with @id)
            if (value['@id']) {
                const badge = document.createElement('span');
                badge.className = 'cedar-ontology-badge';
                badge.textContent = '🔗 Ontology Term';
                valueElement.appendChild(badge);
                
                const link = document.createElement('a');
                link.href = value['@id'];
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                const labelValue = value['rdfs:label'];
                link.textContent = (typeof labelValue === 'object' && labelValue['@value']) ? labelValue['@value'] : labelValue || value['@id'];
                valueElement.appendChild(link);
            } else {
                // Regular value field
                const displayValue = value['@value'];
                if (displayValue !== null && displayValue !== undefined) {
                    const linkableContent = this.makeLinksClickable(displayValue);
                    if (linkableContent instanceof DocumentFragment) {
                        valueElement.appendChild(linkableContent);
                    } else {
                        valueElement.textContent = linkableContent;
                    }
                } else {
                    valueElement.textContent = '—';
                    valueElement.classList.add('empty');
                }
            }

            fieldDiv.appendChild(valueElement);
            return fieldDiv;
        }

        renderArrayField(fieldName, fieldSchema, value, label, description) {
            const items = Array.isArray(value) ? value : [];
            
            // Check if this is a checkbox group
            const itemSchema = fieldSchema.items;
            const isCheckboxGroup = itemSchema?._ui?.inputType === 'checkbox' || itemSchema?._ui?.inputType === 'radio';
            const hasLiterals = itemSchema?._valueConstraints?.literals?.length > 0;
            
            // Skip empty arrays only if not a checkbox group (checkbox groups should show even if empty)
            if (items.length === 0 && !isCheckboxGroup) {
                return null;
            }

            const fieldDiv = document.createElement('div');
            fieldDiv.className = 'cedar-field';

            const labelElement = document.createElement('div');
            labelElement.className = 'cedar-field-label';
            labelElement.textContent = label;
            fieldDiv.appendChild(labelElement);

            // Show description if available and meaningful
            if (description && description !== 'Help Text' && description !== 'Description of category variables' && description.trim()) {
                const descElement = document.createElement('div');
                descElement.className = 'cedar-field-description';
                descElement.textContent = description;
                fieldDiv.appendChild(descElement);
            }

            // Render checkbox/radio groups as comma-separated values
            if (isCheckboxGroup && hasLiterals) {
                const valueElement = document.createElement('div');
                valueElement.className = 'cedar-field-value';
                
                const selectedValues = items.map(item => item['@value']).filter(v => v);
                if (selectedValues.length > 0) {
                    valueElement.textContent = selectedValues.join(', ');
                } else {
                    valueElement.textContent = '—';
                    valueElement.classList.add('empty');
                }
                
                fieldDiv.appendChild(valueElement);
            } else {
                // Render as array items
                const arrayContainer = document.createElement('div');
                arrayContainer.className = 'cedar-array-items';

                items.forEach((item, index) => {
                    const itemElement = this.renderArrayItem(fieldName, itemSchema, item, index);
                    if (itemElement) {
                        arrayContainer.appendChild(itemElement);
                    }
                });

                fieldDiv.appendChild(arrayContainer);
            }

            return fieldDiv;
        }

        renderArrayItem(fieldName, itemSchema, value, index) {
            const itemType = itemSchema['@type'];
            const isCedarField = itemType === 'https://schema.metadatacenter.org/core/TemplateField';

            // For Cedar TemplateFields, render as simple value
            if (isCedarField) {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cedar-array-item';

                const itemHeader = document.createElement('div');
                itemHeader.className = 'cedar-array-item-header';
                itemHeader.textContent = `Item ${index + 1}`;
                itemDiv.appendChild(itemHeader);

                const valueElement = document.createElement('div');
                valueElement.className = 'cedar-field-value';

                // Handle ontology fields
                if (value && value['@id']) {
                    const badge = document.createElement('span');
                    badge.className = 'cedar-ontology-badge';
                    badge.textContent = '🔗 Ontology Term';
                    valueElement.appendChild(badge);
                    
                    const link = document.createElement('a');
                    link.href = value['@id'];
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    const labelValue = value['rdfs:label'];
                    link.textContent = (typeof labelValue === 'object' && labelValue['@value']) ? labelValue['@value'] : labelValue || value['@id'];
                    valueElement.appendChild(link);
                } else if (value && value['@value'] !== null && value['@value'] !== undefined) {
                    const linkableContent = this.makeLinksClickable(value['@value']);
                    if (linkableContent instanceof DocumentFragment) {
                        valueElement.appendChild(linkableContent);
                    } else {
                        valueElement.textContent = linkableContent;
                    }
                } else {
                    return null; // Skip empty items
                }

                itemDiv.appendChild(valueElement);
                return itemDiv;
            }

            // For objects with properties (nested elements in arrays)
            if (itemSchema.properties) {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cedar-array-item';

                const itemHeader = document.createElement('div');
                itemHeader.className = 'cedar-array-item-header';
                itemHeader.textContent = `Item ${index + 1}`;
                itemDiv.appendChild(itemHeader);

                const properties = itemSchema.properties || {};
                const order = itemSchema._ui?.order || Object.keys(properties);

                for (const key of order) {
                    const fieldSchema = properties[key];
                    if (!fieldSchema || key.startsWith('@')) continue;

                    const currentValue = value && value[key];
                    const fieldLabel = itemSchema._ui?.propertyLabels?.[key] || fieldSchema['schema:name'] || key;
                    const fieldDesc = itemSchema._ui?.propertyDescriptions?.[key] || fieldSchema['schema:description'];

                    // Check if this is an array field - if so, render it as an array
                    if (fieldSchema.type === 'array') {
                        const arrayFieldElement = this.renderArrayField(key, fieldSchema, currentValue, fieldLabel, fieldDesc);
                        if (arrayFieldElement) {
                            itemDiv.appendChild(arrayFieldElement);
                        }
                        continue;
                    }

                    // Render field (including empty ones for nested array items)
                    const fieldDiv = document.createElement('div');
                    fieldDiv.className = 'cedar-field';

                    const labelElement = document.createElement('div');
                    labelElement.className = 'cedar-field-label';
                    labelElement.textContent = fieldLabel;
                    fieldDiv.appendChild(labelElement);

                    // Show description if available and meaningful
                    if (fieldDesc && fieldDesc !== 'Help Text' && fieldDesc.trim()) {
                        const descElement = document.createElement('div');
                        descElement.className = 'cedar-field-description';
                        descElement.textContent = fieldDesc;
                        fieldDiv.appendChild(descElement);
                    }

                    const valueElement = document.createElement('div');
                    valueElement.className = 'cedar-field-value';

                    // Handle ontology fields (with @id)
                    if (currentValue && currentValue['@id']) {
                        const badge = document.createElement('span');
                        badge.className = 'cedar-ontology-badge';
                        badge.textContent = '🔗 Ontology Term';
                        valueElement.appendChild(badge);
                        
                        const link = document.createElement('a');
                        link.href = currentValue['@id'];
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        const labelValue = currentValue['rdfs:label'];
                        link.textContent = (typeof labelValue === 'object' && labelValue['@value']) ? labelValue['@value'] : labelValue || currentValue['@id'];
                        valueElement.appendChild(link);
                    } else if (currentValue && currentValue['@value'] !== null && currentValue['@value'] !== undefined) {
                        // Regular value field with content
                        const linkableContent = this.makeLinksClickable(currentValue['@value']);
                        if (linkableContent instanceof DocumentFragment) {
                            valueElement.appendChild(linkableContent);
                        } else {
                            valueElement.textContent = linkableContent;
                        }
                    } else {
                        // Empty or missing value
                        valueElement.textContent = '—';
                        valueElement.classList.add('empty');
                    }

                    fieldDiv.appendChild(valueElement);
                    itemDiv.appendChild(fieldDiv);
                }

                return itemDiv;
            }

            return null;
        }

        renderNestedElement(fieldName, fieldSchema, value, label, description) {
            // Skip if no value
            if (!value) {
                return null;
            }

            const elementDiv = document.createElement('div');
            elementDiv.className = 'cedar-nested-element';

            const titleElement = document.createElement('div');
            titleElement.className = 'cedar-nested-element-title';
            titleElement.textContent = label;
            elementDiv.appendChild(titleElement);

            // Show description if available and meaningful
            if (description && description !== 'Help Text' && description.trim()) {
                const descElement = document.createElement('div');
                descElement.className = 'cedar-field-description';
                descElement.style.marginBottom = '1rem';
                descElement.textContent = description;
                elementDiv.appendChild(descElement);
            }

            const properties = fieldSchema.properties || {};
            const order = fieldSchema._ui?.order || Object.keys(properties);

            for (const key of order) {
                const propertySchema = properties[key];
                if (!propertySchema || key.startsWith('@')) continue;

                const propertyValue = value[key];
                const propertyLabel = fieldSchema._ui?.propertyLabels?.[key] || propertySchema['schema:name'] || key;
                const propertyDesc = fieldSchema._ui?.propertyDescriptions?.[key] || propertySchema['schema:description'];

                const fieldElement = this.renderField(key, propertySchema, propertyValue);
                if (fieldElement) {
                    elementDiv.appendChild(fieldElement);
                }
            }

            return elementDiv;
        }
    }

    // Initialize and render
    const viewer = new InstanceViewer(templateObject, instanceData, 'instance-view');
    viewer.render();
</script>
{% endblock %}
