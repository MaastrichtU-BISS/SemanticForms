<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      table td {
        word-wrap: break-word;         /* All browsers since IE 5.5+ */
        overflow-wrap: break-word;     /* Renamed property in CSS3 draft spec */
      }
      
      /* Sidebar styles */
      .filter-sidebar {
        position: fixed;
        top: 0;
        left: -320px; /* Initially hidden off-screen */
        width: 320px;
        height: 100vh;
        background-color: #f8f9fa;
        border-right: 2px solid #dee2e6;
        transition: left 0.3s ease-in-out;
        z-index: 1040;
        overflow-y: auto;
        padding-top: 60px; /* Account for navbar height */
      }
      
      .filter-sidebar.open {
        left: 0; /* Slide in when open */
      }
      
      .filter-sidebar .sidebar-header {
        padding: 1rem;
        background-color: #e9ecef;
        border-bottom: 1px solid #dee2e6;
      }
      
      .filter-sidebar .sidebar-content {
        padding: 1rem;
      }
      
      .content-area {
        transition: margin-left 0.3s ease-in-out;
      }
      
      .content-area.sidebar-open {
        margin-left: 320px;
      }
      
      .filter-toggle-btn {
        position: fixed;
        top: 70px;
        left: 10px;
        z-index: 1050;
        border-radius: 0 5px 5px 0;
        padding: 8px 12px;
      }
      
      .filter-toggle-btn.sidebar-open {
        left: 330px;
      }
      
      .sidebar-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 1030;
        display: none;
      }
      
      .sidebar-overlay.show {
        display: block;
      }
      
      /* Mobile responsiveness */
      @media (max-width: 768px) {
        .content-area.sidebar-open {
          margin-left: 0;
        }
        
        .filter-toggle-btn.sidebar-open {
          left: 10px;
        }
        
        .sidebar-overlay.show {
          display: block;
        }
      }
    </style>
</head>

<script>
  function onLoad() {
    var timeObjects = document.querySelectorAll('time')
    timeObjects.forEach((timeObject) => {
      var dateTime = timeObject.getAttribute('datetime')
      timeObject.innerHTML = new Date(dateTime).toLocaleString()
      console.log(timeObject.innerHTML)
    });
  }
  
  // Sidebar toggle functionality
  function toggleSidebar() {
    const sidebar = document.querySelector('.filter-sidebar');
    const content = document.querySelector('.content-area');
    const toggleBtn = document.querySelector('.filter-toggle-btn');
    const overlay = document.querySelector('.sidebar-overlay');
    
    const isOpen = sidebar.classList.contains('open');
    
    if (isOpen) {
      sidebar.classList.remove('open');
      content.classList.remove('sidebar-open');
      toggleBtn.classList.remove('sidebar-open');
      overlay.classList.remove('show');
      toggleBtn.innerHTML = '⚙️ Filters';
    } else {
      sidebar.classList.add('open');
      content.classList.add('sidebar-open');
      toggleBtn.classList.add('sidebar-open');
      if (window.innerWidth <= 768) {
        overlay.classList.add('show');
      }
      toggleBtn.innerHTML = '✖️ Close';
    }
  }
  
  // Close sidebar when clicking overlay on mobile
  function closeSidebarOverlay() {
    const sidebar = document.querySelector('.filter-sidebar');
    const content = document.querySelector('.content-area');
    const toggleBtn = document.querySelector('.filter-toggle-btn');
    const overlay = document.querySelector('.sidebar-overlay');
    
    sidebar.classList.remove('open');
    content.classList.remove('sidebar-open');
    toggleBtn.classList.remove('sidebar-open');
    overlay.classList.remove('show');
    toggleBtn.innerHTML = '⚙️ Filters';
  }
</script>

<body class="bg-light" onload="onLoad()">
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="https://github.com/MaastrichtU-CDS/SemanticForms">GitHub</a>
          </li>
        </ul>
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <!-- if user is None, show as submit object -->
            {% if user is none %}
            <form action="/login" method="post">
              <a href="#" class="nav-link" onclick="this.closest('form').submit(); return false;">Login</a>
            </form>
            {% else %}
            <form action="/logout" method="post">
                <a href="#" class="nav-link" onclick="this.closest('form').submit(); return false;">Logout {{ user['preferred_username'] }}</a>
            </form>
            {% endif %}
          </li>
        </ul>
      </nav>
    
    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" onclick="closeSidebarOverlay()"></div>
    
    <!-- Filter Toggle Button -->
    <button class="btn btn-primary filter-toggle-btn" onclick="toggleSidebar()">⚙️ Filters</button>
    
    <!-- Filter Sidebar -->
    <div class="filter-sidebar">{% block sidebar %}{% endblock %}</div>
    
    <!-- Main Content Area -->
    <div class="container pt-5 content-area">{% block content %}{% endblock %}</div>
</body>

</html>
