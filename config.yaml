server:
  storageFolder: ./data
# Default API key used for CEDAR templates (can be overridden per template)
api_key: api_key
template:
  source: cedar
  templateId: e1c5e285-a2e6-43df-9bfa-1de71f6a59e3
  storage: local
  instance_base_url: http://localhost
  title_predicate: title
bioportal:
  api_key: 8b5b7825-538d-40e0-9e9e-5ab9274a9aeb
tableColumns:
  - property: "General Model Information.Title"
    label: "Title"
    linkable: true
  - property: "General Model Information.Created by"
    label: "Author"
  - property: "General Model Information.Creation date"
    label: "Date created"
  - property: "General Model Information.Developed at CDS (Maastro)"
    label: "Organisation"
# Optional: Project functionality configuration
# Uncomment and configure to enable multi-phase project workflow
projects:
  enabled: true
  # Optional: CEDAR template for project metadata
  project_metadata_template:
    source: cedar
    templateId: your_project_template_id_here
  # Define project phases and their associated templates/questionnaires
  phases:
    - name: "Phase 1: Initial Assessment"
      template:
        source: cedar
        templateId: template_id_for_phase1
        title_predicate: title
    - name: "Phase 2: Development"
      template:
        source: cedar
        templateId: template_id_for_phase2
        title_predicate: title
    - name: "Phase 3: Evaluation"
      template:
        source: cedar
        templateId: template_id_for_phase3
        title_predicate: title