name: Build WebUI

# Image tags produced (ghcr.io/<owner>/<repo>:<tag>):
#   push to main               -> main, latest
#   push to release/X.Y.Z      -> X.Y.Z-rc (latest candidate), X.Y.Z-rc.<run number> (immutable)
#   git tag X.Y.Z or vX.Y.Z    -> X.Y.Z (the release) and X.Y (moves to the newest patch release)
#   push to any other branch   -> <branch name, with characters invalid in docker tags replaced by '-'>

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

env:
  REGISTRY: ghcr.io

jobs:
  containerize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine image tags
        id: image_tags
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          # Docker tags may only contain [A-Za-z0-9_.-]
          sanitize() { echo "$1" | sed -e 's/[^A-Za-z0-9_.-]/-/g'; }

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Release: build the released version
            VERSION="$(sanitize "${GITHUB_REF_NAME#v}")"
            TAGS="${IMAGE}:${VERSION}"
            # For X.Y.Z releases also move the X.Y tag, so deployments can follow patch releases
            if [[ "${VERSION}" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
              TAGS="${TAGS},${IMAGE}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            fi
          elif [[ "${GITHUB_REF_NAME}" == release/* ]]; then
            # Release branch: build a release candidate
            VERSION="${GITHUB_REF_NAME#release/}"
            VERSION="$(sanitize "${VERSION#v}")"
            TAGS="${IMAGE}:${VERSION}-rc,${IMAGE}:${VERSION}-rc.${GITHUB_RUN_NUMBER}"
          else
            TAGS="${IMAGE}:$(sanitize "${GITHUB_REF_NAME}")"
            if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              TAGS="${TAGS},${IMAGE}:latest"
            fi
          fi

          echo "Image tags: ${TAGS}"
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"

      - name: Log in to the Container registry
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
